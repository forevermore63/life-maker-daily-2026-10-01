<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><title>Retreat Seed Map</title><style>body{font-family:Georgia,serif;background:#0f1a14;color:#f4efe4;padding:28px;max-width:640px}a{color:#e8c97a}input{width:100%;padding:8px;background:#16241c;color:#f4efe4;border:1px solid #2d4638}</style></head><body><h1>Retreat Seed Map</h1><p>Interest list for QLD hinterland and NSW South Coast stillness. Not a booking. A seed.</p><input id="e" placeholder="email or first name"/><p><button id="b" style="font:inherit;background:#e8c97a;border:0;border-radius:999px;padding:8px 14px">Hold my place locally</button></p><p id="m"></p><p><a href="../monitor.html">Monitor</a></p><script>b.onclick=()=>{const L=JSON.parse(localStorage.getItem('rs1001')||'[]');if(e.value.trim()){L.unshift(e.value.trim());localStorage.setItem('rs1001',JSON.stringify(L.slice(0,50)));m.textContent='Held on this device: '+L.length+' seeds.';e.value='';}}</script></body></html>
