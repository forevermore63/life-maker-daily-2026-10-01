<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Quiet Hour Vault</title><style>body{font-family:Georgia,serif;background:#0f1a14;color:#f4efe4;padding:28px;max-width:640px}a,button{color:#1a1408;background:#e8c97a;border:0;border-radius:999px;padding:10px 16px;text-decoration:none;display:inline-block;margin-top:12px}</style></head><body><h1>Quiet Hour Vault</h1><p>Protect one hour. Gift presence, not noise. PayID when you are ready. Engine 01 of the 1 Oct 2026 fleet.</p><p id="n">Hours marked today: 0</p><button type="button" id="m">Mark one quiet hour</button><p><a href="../monitor.html">Back to monitor</a></p><script>const k='qh1001';let n=+localStorage.getItem(k)||0;const draw=()=>document.getElementById('n').textContent='Hours marked today: '+n;draw();document.getElementById('m').onclick=()=>{n++;localStorage.setItem(k,n);draw();}</script></body></html>
