<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><title>Presence Ledger</title><style>body{font-family:Georgia,serif;background:#0f1a14;color:#f4efe4;padding:28px;max-width:640px}a{color:#e8c97a}textarea{width:100%;min-height:90px;background:#16241c;color:#f4efe4;border:1px solid #2d4638}</style></head><body><h1>Presence Ledger</h1><p>Log giving and hours returned. Stays on this device.</p><textarea id="t" placeholder="Who was helped. What was given."></textarea><p><button id="s" style="font:inherit;background:#e8c97a;border:0;border-radius:999px;padding:8px 14px">Save line</button></p><pre id="o"></pre><p><a href="../monitor.html">Monitor</a></p><script>const k='pl1001';const load=()=>JSON.parse(localStorage.getItem(k)||'[]');const draw=()=>o.textContent=load().join('\n');draw();s.onclick=()=>{const L=load();if(t.value.trim()){L.unshift(new Date().toISOString().slice(0,16)+' '+t.value.trim());localStorage.setItem(k,JSON.stringify(L.slice(0,40)));t.value='';draw();}}</script></body></html>
